[settings]
dotfiles.root = "dotfiles"
dotfiles.default_mode = "symlink"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.update-tools]
scope = "user"
command = "~/.local/bin/update-tools"
restart = "never"
state = "stopped"
enabled = true
environment = { HOME = "~", PATH = "~/.local/share/mise/shims:~/.local/bin:/usr/local/bin:/usr/bin:/bin" }

[bootstrap.services.update-skills]
scope = "user"
command = "~/.local/bin/update-skills"
restart = "never"
state = "stopped"
enabled = true
environment = { HOME = "~", PATH = "~/.local/share/mise/shims:~/.local/bin:/usr/local/bin:/usr/bin:/bin" }

[dotfiles]
"~/.zshrc" = "dotfiles/.zshrc"
"~/.zshenv" = "dotfiles/.zshenv"
"~/.alias.zsh" = "dotfiles/.alias.zsh"
"~/.p10k.zsh" = "dotfiles/.p10k.zsh"
"~/.gitconfig" = "dotfiles/.gitconfig"
"~/.config/git/ignore" = "dotfiles/.config/git/ignore"
"~/.config/ghostty/config" = "dotfiles/.config/ghostty/config"
"~/.config/mise/config.toml" = "dotfiles/.config/mise/config.toml"
"~/.config/environment.d/flatpak.conf" = "dotfiles/.config/environment.d/flatpak.conf"
"~/.config/JetBrains/IntelliJIdea/idea64.vmoptions" = "dotfiles/.config/JetBrains/IntelliJIdea/idea64.vmoptions"
"~/.config/user-dirs.dirs" = "dotfiles/.config/user-dirs.dirs"
"~/.config/user-dirs.locale" = "dotfiles/.config/user-dirs.locale"
"~/.config/xdg-terminals.list" = "dotfiles/.config/xdg-terminals.list"
"~/.local/bin/gradia" = "dotfiles/.local/bin/gradia"
"~/.local/share/backgrounds/wallpaper.jpg" = "dotfiles/.local/share/backgrounds/wallpaper.jpg"
"~/.claude/statusline.sh" = "dotfiles/.claude/statusline.sh"
"~/.local/bin/update-tools" = "dotfiles/.local/bin/update-tools"
"~/.config/systemd/user/update-tools.timer" = "dotfiles/.config/systemd/user/update-tools.timer"
"~/.local/bin/update-skills" = "dotfiles/.local/bin/update-skills"
"~/.config/systemd/user/update-skills.timer" = "dotfiles/.config/systemd/user/update-skills.timer"
